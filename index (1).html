<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taisho Café - V2 Street Market</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;700;900&family=Federo&family=Jost:wght@400;600;800;900&display=swap" rel="stylesheet">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#17120F;--bg2:#1E1915;--card:#2A382D;--card-brown:#3B2C24;--card-brown2:#332A24;--text:#F5EEDB;--text-dim:rgba(245,238,219,.88);--accent:#D78B43;--accent2:#E0934C;--green:#8CB27D;--bosque:#325638;--rosa:#E5A6A6;--chocolate:#3B2C24;--line:rgba(245,238,219,.12);--line-green:rgba(140,178,125,.20);--line-brown:rgba(59,44,36,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#17120F}
body{background:#17120F;background-image:radial-gradient(900px 500px at 20% 0%,rgba(50,86,56,.35),transparent),radial-gradient(800px 400px at 80% 10%,rgba(59,44,36,.55),transparent),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Jost,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:0 16px 50px}
header{text-align:center;padding:28px 0 18px;position:relative}
.logo{width:132px;height:132px;border-radius:50%;border:3px solid #F5EEDB;background:#F5EEDB;margin:0 auto;overflow:hidden;box-shadow:0 0 0 4px #325638,0 0 0 7px rgba(245,238,219,.12),0 0 0 9px #3B2C24,0 16px 32px rgba(0,0,0,.55);position:relative;z-index:2}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:Federo,serif;font-weight:400;font-size:34px;letter-spacing:4px;margin-top:20px;text-transform:uppercase;color:var(--text)} h1 span{color:var(--text);font-family:Cinzel,serif;font-weight:700}
.sub{display:inline-block;background:var(--bosque);color:#F5EEDB;font-family:Federo,serif;font-weight:400;font-size:11px;letter-spacing:3px;padding:6px 14px;border-radius:100px;margin-top:8px;border:1px solid var(--green)}
.info{font-size:11px;color:var(--text-dim);line-height:1.5;background:rgba(245,238,219,.10);padding:8px 14px;border-radius:100px;display:inline-block;border:1px solid rgba(245,238,219,.12)}
.tabs-wrap{position:sticky;top:0;z-index:20;background:rgba(23,18,15,.96);backdrop-filter:blur(12px);border-bottom:2px dashed var(--line);margin:0 -16px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 14px;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
.tab{border:1.5px solid rgba(245,238,219,.14);background:linear-gradient(180deg,var(--card),var(--card-brown));color:var(--text);font-family:Jost;font-size:11px;font-weight:700;letter-spacing:.5px;padding:10px 16px;border-radius:14px;white-space:nowrap;transition:.2s}
.tab.active{background:var(--bosque);color:#F5EEDB;border-color:var(--accent);box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.card{background:linear-gradient(180deg,var(--card),var(--card-brown2));border-radius:22px;padding:22px;border:1px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(245,238,219,.06);margin:16px 0;position:relative;color:var(--text)}
.card *{color:inherit}
.pill{background:#D78B43;color:#261D18!important;font-weight:800;font-size:12px;padding:7px 14px;border-radius:100px;display:inline-block;box-shadow:3px 3px 0 rgba(0,0,0,.35);letter-spacing:.3px;border:1.5px solid #D78B43}
.pill.outline{background:#D78B43;color:#261D18!important;box-shadow:3px 3px 0 rgba(0,0,0,.35);border:1.5px solid #D78B43}
.chip{font-size:11px;padding:6px 11px;border-radius:100px;background:rgba(59,44,36,.45);border:1px solid rgba(245,238,219,.14);font-weight:600;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.badge{position:absolute;top:-10px;right:14px;background:var(--green);color:#17120F;font-size:9px;font-weight:900;padding:5px 10px;border-radius:100px;letter-spacing:.5px;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.whatsapp-float{position:fixed;bottom:22px;right:18px;z-index:9999;background:#25D366;color:#fff;border:2px solid #F5EEDB;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 0 4px rgba(37,211,102,.22);text-decoration:none;transition:.25s;pointer-events:auto;cursor:pointer}
.whatsapp-float:active{transform:scale(.92)}
.btn-whatsapp{display:inline-flex;align-items:center;gap:8px;background:#3B2C24;color:#F5EEDB!important;border:1.5px solid var(--green);padding:10px 18px;border-radius:100px;font-family:Jost;font-weight:700;font-size:12px;letter-spacing:.5px;text-decoration:none;box-shadow:4px 4px 0 var(--bosque);margin-top:12px}
.btn-whatsapp *{color:#F5EEDB!important}
.instagram-link{color:#F5EEDB!important;text-decoration:none;font-weight:600}
.accent-orange{color:var(--accent2);} .dot-orange{background:var(--accent2)!important} 
.card.brown{border-left:4px solid var(--chocolate)!important; background:linear-gradient(180deg,var(--card-brown),var(--card-brown2))!important} .card.bosque{border-left:4px solid var(--bosque)!important} 
/* Forzar visibilidad de textos secundarios que antes tenían opacity .6 */
.card p, .card span, .card div{opacity:1!important}
.card p[style*="opacity"], span[style*="opacity"]{opacity:.88!important}
</style></head><body><div class="wrap">
